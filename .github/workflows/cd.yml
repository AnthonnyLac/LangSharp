name: Publish NuGet Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" 

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      configuration: Release

  test:
    uses: ./.github/workflows/tests.yml
    needs: build
    with:
      configuration: Release

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Restore dependencies
      run: dotnet restore

    - name: Pack project
      run: dotnet pack ./src/LangSharp/LangSharp.csproj -c Release -o out

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }} 
        release_name: Release ${{ github.ref_name }}
        body: |
          This release includes the latest version of LangSharp.
        draft: false
        prerelease: false

    - name: Upload NuGet Package to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./out/*.nupkg
        asset_name: LangSharp.${{ github.ref_name }}.nupkg
        asset_content_type: application/octet-stream

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push ./out/LangSharp.${{ github.ref_name }}.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json