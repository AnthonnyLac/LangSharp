name: Build and SonarQube Analysis

on:
  push:
    branches:
      - develop
      - feature/sonar-pipe

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Subir SonarQube
        run: docker compose up -d

      - name: Listar containers
        run: docker ps -a

      - name: Logs Postgres (últimas 50 linhas)
        run: docker logs $(docker ps -qf "name=sonar_db") --tail 50

      - name: Logs SonarQube (últimas 50 linhas)
        run: docker logs $(docker ps -qf "name=sonarqube") --tail 50

      - name: Esperar banco Postgres ficar pronto
        run: |
          echo "Esperando banco Postgres..."
          # Pega o nome da rede criada pelo docker compose
          network=$(docker network ls --filter name=langsharp_default -q)
          for i in {1..30}; do
            if docker run --rm --network $network postgres:13 pg_isready -h sonar_db -p 5432 -U sonar >/dev/null 2>&1; then
              echo "Banco Postgres está pronto!"
              exit 0
            fi
            echo "Banco ainda não está pronto. Tentativa $i/30..."
            sleep 5
          done
          echo "Erro: Banco Postgres não ficou pronto após 2min30s."
          exit 1

      - name: Esperar SonarQube saudável
        id: esperar-sonarqube
        run: |
          echo "Esperando SonarQube ficar saudável..."
          for i in {1..60}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' $(docker ps -qf "name=sonarqube"))
            echo "Status atual: $status"
            if [ "$status" == "healthy" ]; then
              echo "SonarQube está saudável!"
              exit 0
            fi
            echo "Aguardando SonarQube..."
            docker logs $(docker ps -qf "name=sonarqube") --tail 10
            sleep 5
          done
          echo "Erro: SonarQube não ficou saudável após 5 minutos."
          exit 1

      - name: Mostrar logs do SonarQube se falhou saúde
        if: failure() && steps.esperar-sonarqube.outcome == 'failure'
        run: |
          echo "==== Logs do container SonarQube (últimas 100 linhas) ===="
          docker logs $(docker ps -qf "name=sonarqube") --tail 100

      - name: Cache SonarQube scanner
        uses: actions/cache@v3
        with:
          path: ~/.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.sonar/scanner
          dotnet tool install --tool-path ~/.sonar/scanner dotnet-sonarscanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: admin  
        run: |
          ~/.sonar/scanner/dotnet-sonarscanner begin /k:"teste" /d:sonar.login="$SONAR_TOKEN" /d:sonar.host.url="http://localhost:9001"
          dotnet build --configuration Release
          ~/.sonar/scanner/dotnet-sonarscanner end /d:sonar.login="$SONAR_TOKEN"

      - name: Derrubar SonarQube
        run: docker compose down -v
